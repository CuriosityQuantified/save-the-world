name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run LLM log routing regression
        run: pytest tests/unit/test_llm_log_routing_regression.py -q
      - name: Run bare-except recovery regression
        run: pytest tests/unit/test_bare_except_regression.py -q
      - name: Run dead-code removal regression
        run: pytest tests/unit/test_dead_code_removal_regression.py -q
      - name: Run WebSocket cleanup regression
        run: pytest tests/unit/test_ws_cleanup_regression.py -q
      - name: Run requirements alignment regression
        run: pytest tests/unit/test_requirements_alignment.py -q
      - name: Run uvicorn reload gating regression
        run: pytest tests/unit/test_uvicorn_reload_regression.py -q
      - name: Run LLM service final-turn parsing regression
        run: pytest tests/unit/test_llm_service.py::test_create_idea_final_turn_conclusion_parsing tests/unit/test_llm_service.py::test_create_idea_final_turn_fallback_parsing -q
      - name: Run nested test discovery regression
        run: pytest tests/unit/test_nested_test_discovery_regression.py -q
      - name: Run unit tests
        # Deselect known-broken tests that are tracked by their own open issues
        # (leave them for those issue-workers; don't scope-creep or race them).
        # The llm_service final-turn parsing tests were fixed by #22 (they had mocked
        # the wrong code path -- service.groq_client instead of LLMChain.arun) and now
        # run in the general suite plus the named regression step above.
        #   - test_cloudflare_r2_service upload/get_url/error  -> its own R2 issue
        #   - test_media_utils::test_ensure_media_directories  -> #13 (env/media dir)
        run: pytest tests/unit/ -q
          --deselect tests/unit/test_cloudflare_r2_service.py::test_upload_video_public
          --deselect tests/unit/test_cloudflare_r2_service.py::test_upload_video_private
          --deselect tests/unit/test_cloudflare_r2_service.py::test_upload_audio_public
          --deselect tests/unit/test_cloudflare_r2_service.py::test_get_file_url_private
          --deselect tests/unit/test_cloudflare_r2_service.py::test_upload_video_error
          --deselect tests/unit/test_media_utils.py::TestMediaUtils::test_ensure_media_directories

  regressions:
    name: Regressions (Playwright e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run save/resume regression suite
        run: npx playwright test tests-e2e/save-resume.spec.js --project=chromium --reporter=line
        env:
          CI: true
      - name: Run mobile regression suite
        run: npx playwright test tests-e2e/mobile.spec.js --project=mobile-chrome --reporter=line
        env:
          CI: true
      - name: Run analytics dashboard regression suite
        run: npx playwright test tests-e2e/analytics.spec.js --project=chromium --reporter=line
        env:
          CI: true
      - name: Run leaderboard regression suite
        run: npx playwright test tests-e2e/leaderboard.spec.js --project=chromium --reporter=line
        env:
          CI: true
      - name: Run difficulty regression suite
        run: npx playwright test tests-e2e/difficulty.spec.js --project=chromium --reporter=line
        env:
          CI: true
      - name: Run theme regression suite
        run: npx playwright test tests-e2e/theme.spec.js --project=chromium --reporter=line
        env:
          CI: true
      - name: Run tutorial regression suite
        run: npx playwright test tests-e2e/tutorial.spec.js --project=chromium --reporter=line
        env:
          CI: true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
